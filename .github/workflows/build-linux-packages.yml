name: Build Linux and Windows packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a versioned GitHub Release with all Linux and Windows packages
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate-cursors:
    name: Validate cursor artwork and aliases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild and validate XCursor data
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zeromouse-venv"
          "$RUNNER_TEMP/zeromouse-venv/bin/pip" install -r requirements.txt
          "$RUNNER_TEMP/zeromouse-venv/bin/python" build.py
          git diff --exit-code -- zeromouse/cursors
          "$RUNNER_TEMP/zeromouse-venv/bin/python" scripts/validate-xcursor.py

  build-arch:
    name: Arch Linux / CachyOS (pacman)
    needs: [validate-cursors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build pacman package in Arch Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            archlinux:base-devel bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel
              if ! getent group "$HOST_GID" >/dev/null; then
                groupadd -g "$HOST_GID" builder
              fi
              useradd --no-create-home --uid "$HOST_UID" --gid "$HOST_GID" builder
              install -d -o "$HOST_UID" -g "$HOST_GID" /tmp/buildhome /work/dist
              runuser -u builder -- bash -c "cd /work && HOME=/tmp/buildhome makepkg --noconfirm --cleanbuild --force"
              package_path="$(runuser -u builder -- env HOME=/tmp/buildhome makepkg --packagelist)"
              test -f "$package_path"
              cp -- "$package_path" /work/dist/
            '
      - uses: actions/upload-artifact@v7
        with:
          name: package-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  build-debian:
    name: Debian / Ubuntu (.deb)
    needs: [validate-cursors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Debian package
        run: bash packaging/build-deb.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-debian
          path: dist/*.deb
          if-no-files-found: error

  build-fedora:
    name: Fedora / RPM (.rpm)
    needs: [validate-cursors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build RPM in Fedora
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/zeromouse-rpm-dist"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/zeromouse-rpm-dist:/out" \
            fedora:latest bash -euo pipefail -c '
              dnf -y install rpm-build tar gzip
              /src/packaging/build-rpm.sh /out
            '
          cp "$RUNNER_TEMP/zeromouse-rpm-dist/"*.rpm dist/
      - uses: actions/upload-artifact@v7
        with:
          name: package-fedora
          path: dist/*.rpm
          if-no-files-found: error

  build-universal:
    name: Universal Linux archive
    needs: [validate-cursors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build portable XCursor archive
        run: bash packaging/build-universal.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-universal
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows 10 / 11 installer
    needs: [validate-cursors]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and validate Windows cursors
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python windows/build-windows-cursors.py
          python windows/validate-windows-cursors.py
      - name: Compile per-user Windows installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @('windows/Install-Cursors.ps1', 'windows/smoke-test-installer.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref] $tokens, [ref] $parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax validation failed for $script."
            }
            $tokens = $null
            $parseErrors = $null
          }

          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must use the numeric MAJOR.MINOR.PATCH format; got '$version'."
          }
          $env:ZEROMOUSE_VERSION = $version
          "ZEROMOUSE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path 'dist/windows' -Force | Out-Null

          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($null -ne $compiler) {
            $compilerPath = $compiler.Source
          } else {
            $compilerCandidates = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe')
            )
            $compilerPath = $compilerCandidates |
              Where-Object { Test-Path -LiteralPath $_ } |
              Select-Object -First 1
            if (-not $compilerPath) {
              throw 'Inno Setup ISCC.exe is not available on this Windows runner.'
            }
          }
          & $compilerPath windows/ZeroMouse.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE." }
      - name: Smoke-test install and cursor restoration
        shell: pwsh
        run: pwsh -NoProfile -File windows/smoke-test-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: dist/windows/ZeroMouse-Setup-*.exe
          if-no-files-found: error

  collect-artifacts:
    name: Collect Linux and Windows packages and checksums
    needs: [build-arch, build-debian, build-fedora, build-universal, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Create SHA-256 manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$(tr -d '\r\n' < VERSION)"
          cd dist
          arch=(zeromouse-cursor-theme-"${version}"-*-any.pkg.tar.zst)
          rpm=(zeromouse-cursor-theme-"${version}"-*.noarch.rpm)
          if (( ${#arch[@]} != 1 || ${#rpm[@]} != 1 )); then
            echo "Expected one Arch package and one RPM for version $version." >&2
            exit 1
          fi
          packages=(
            "${arch[0]}"
            "${rpm[0]}"
            "zeromouse-cursor-theme_${version}_all.deb"
            "zeromouse-cursor-theme-${version}-linux-any.tar.gz"
            "ZeroMouse-Setup-${version}.exe"
          )
          for package in "${packages[@]}"; do
            if [[ ! -s "$package" ]]; then
              echo "Missing or empty package: $package" >&2
              exit 1
            fi
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#packages[@]}"
          sha256sum -- "${packages[@]}" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish optional Linux and Windows GitHub Release
    if: ${{ inputs.publish_release }}
    needs: [collect-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: dist
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace it." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Git tag $tag already exists; refusing to publish a release from a stale tag." >&2
            exit 1
          fi
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "ZeroMouse ${version}" \
            --generate-notes
